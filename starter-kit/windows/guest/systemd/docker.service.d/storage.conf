[Unit]
Requires=data.mount var-lib-starter\x2dkit.mount
RequiresMountsFor=/data /var/lib/starter-kit
BindsTo=data.mount var-lib-starter\x2dkit.mount
After=data.mount var-lib-starter\x2dkit.mount
StartLimitIntervalSec=0
[Service]
ExecStartPre=/usr/bin/python3 /opt/starter-kit/storage.py verify --config /etc/starter-kit/config.json
