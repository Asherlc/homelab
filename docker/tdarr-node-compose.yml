# Tdarr Node — run on laptop to transcode media for the homelab Tdarr Server.
# Requires the NAS media share mounted at ~/mnt/homelab-media.
#
# Usage:
#   docker compose -f docker/tdarr-node-compose.yml up -d
#
# Mount media first (macOS):
#   mkdir -p ~/mnt/homelab-media
#   mount_smbfs //asherlc@nas.local/data ~/mnt/homelab-media
services:
  tdarr-node:
    container_name: tdarr-node
    image: ghcr.io/haveagitgat/tdarr_node:2.63.01
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=US/Pacific
      - UMASK_SET=002
      - nodeName=LaptopNode
      - serverIP=192.168.1.197
      - serverPort=8266
      - inContainer=true
      - ffmpegVersion=7
    volumes:
      - tdarr-node-config:/app/configs
      - ~/mnt/homelab-media/media:/media
      - /tmp/tdarr-transcode:/temp

volumes:
  tdarr-node-config:
