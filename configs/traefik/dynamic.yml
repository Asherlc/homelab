http:
  middlewares:
    add-forward-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
    authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
    scrypted-basic-auth:
      headers:
        customRequestHeaders:
          Authorization: "Basic YXV0aGVudGlrOmgyVTk7MjhDYzc1JQ=="

  routers:
    outpost:
      rule: PathPrefix(`/outpost.goauthentik.io/`)
      entryPoints:
        - web
      service: authentik
      priority: 1000

    authentik-external:
      rule: Host(`authentik.asherlc.com`)
      entryPoints:
        - web
      service: authentik
      middlewares:
        - add-forward-headers

    radarr-external:
      rule: Host(`radarr.asherlc.com`)
      entryPoints:
        - web
      service: radarr
      middlewares:
        - add-forward-headers
        - authentik
    sonarr-external:
      rule: Host(`sonarr.asherlc.com`)
      entryPoints:
        - web
      service: sonarr
      middlewares:
        - add-forward-headers
        - authentik
    qbittorrent-external:
      rule: Host(`qbittorrent.asherlc.com`)
      entryPoints:
        - web
      service: qbittorrent
      middlewares:
        - add-forward-headers
        - authentik
    prowlarr-external:
      rule: Host(`prowlarr.asherlc.com`)
      entryPoints:
        - web
      service: prowlarr
      middlewares:
        - add-forward-headers
        - authentik
    dashdot-external:
      rule: Host(`dashdot.asherlc.com`)
      entryPoints:
        - web
      service: dashdot
      middlewares:
        - add-forward-headers
        - authentik
    zigbee-external:
      rule: Host(`zigbee2mqtt.asherlc.com`)
      entryPoints:
        - web
      service: zigbee2mqtt
      middlewares:
        - add-forward-headers
    zigbee-alias-external:
      rule: Host(`zigbee.asherlc.com`)
      entryPoints:
        - web
      service: zigbee2mqtt
      middlewares:
        - add-forward-headers
        - authentik
    homarr-external:
      rule: Host(`homarr.asherlc.com`)
      entryPoints:
        - web
      service: homarr
      middlewares:
        - add-forward-headers
        - authentik
    scrypted-external:
      rule: Host(`scrypted.asherlc.com`)
      entryPoints:
        - web
      service: scrypted
      middlewares:
        - add-forward-headers
        - authentik
        - scrypted-basic-auth
    pihole-external:
      rule: Host(`pihole.asherlc.com`)
      entryPoints:
        - web
      service: pihole
      middlewares:
        - add-forward-headers
        - authentik
    calibre-external:
      rule: Host(`calibre.asherlc.com`)
      entryPoints:
        - web
      service: calibre
      middlewares:
        - add-forward-headers
        - authentik
    frigate-external:
      rule: Host(`frigate.asherlc.com`)
      entryPoints:
        - web
      service: frigate
      middlewares:
        - add-forward-headers
        - authentik

    homarr-local:
      rule: Host(`homarr.home`)
      entryPoints:
        - web
      service: homarr
    plex-local:
      rule: Host(`plex.home`)
      entryPoints:
        - web
      service: plex
    sonarr-local:
      rule: Host(`sonarr.home`)
      entryPoints:
        - web
      service: sonarr
    radarr-local:
      rule: Host(`radarr.home`)
      entryPoints:
        - web
      service: radarr
    bazarr-local:
      rule: Host(`bazarr.home`)
      entryPoints:
        - web
      service: bazarr
    prowlarr-local:
      rule: Host(`prowlarr.home`)
      entryPoints:
        - web
      service: prowlarr
    overseerr-external:
      rule: Host(`seerr.asherlc.com`) || Host(`overseerr.asherlc.com`)
      entryPoints:
        - web
      service: overseerr
      middlewares:
        - add-forward-headers
    overseerr-local:
      rule: Host(`overseerr.home`)
      entryPoints:
        - web
      service: overseerr
    tautulli-local:
      rule: Host(`tautulli.home`)
      entryPoints:
        - web
      service: tautulli
    zigbee2mqtt-local:
      rule: Host(`zigbee2mqtt.home`)
      entryPoints:
        - web
      service: zigbee2mqtt
    qbittorrent-local:
      rule: Host(`qbittorrent.home`)
      entryPoints:
        - web
      service: qbittorrent
    scrypted-local:
      rule: Host(`scrypted.home`)
      entryPoints:
        - web
      service: scrypted
    pihole-local:
      rule: Host(`pihole.home`)
      entryPoints:
        - web
      service: pihole
    calibre-local:
      rule: Host(`calibre.home`)
      entryPoints:
        - web
      service: calibre
    nas-external:
      rule: Host(`nas.asherlc.com`)
      entryPoints:
        - web
      service: nas
      middlewares:
        - add-forward-headers
    nas-local:
      rule: Host(`nas.home`)
      entryPoints:
        - web
      service: nas

    frigate-local:
      rule: Host(`frigate.home`)
      entryPoints:
        - web
      service: frigate

    openwearables-external:
      rule: Host(`openwearables.asherlc.com`)
      entryPoints:
        - web
      service: openwearables
      middlewares:
        - add-forward-headers
    openwearables-api-external:
      rule: Host(`openwearables-api.asherlc.com`)
      entryPoints:
        - web
      service: openwearables-api
      middlewares:
        - add-forward-headers
    openwearables-local:
      rule: Host(`openwearables.home`)
      entryPoints:
        - web
      service: openwearables
    openwearables-api-local:
      rule: Host(`openwearables-api.home`)
      entryPoints:
        - web
      service: openwearables-api

    grafana-external:
      rule: Host(`grafana.asherlc.com`)
      entryPoints:
        - web
      service: grafana
      middlewares:
        - add-forward-headers
        - authentik
    grafana-local:
      rule: Host(`grafana.home`)
      entryPoints:
        - web
      service: grafana

    dofek-external:
      rule: Host(`dofek.asherlc.com`)
      entryPoints:
        - web
      service: dofek-client
      middlewares:
        - add-forward-headers
      priority: 1
    dofek-oauth-callback:
      rule: Host(`dofek.asherlc.com`) && (Path(`/callback`) || PathPrefix(`/auth/`))
      entryPoints:
        - web
      service: dofek-client
      middlewares:
        - add-forward-headers
      priority: 10
    dofek-local:
      rule: Host(`dofek.home`)
      entryPoints:
        - web
      service: dofek-client

  serversTransports:
    insecureTransport:
      insecureSkipVerify: true
  services:
