http:
  middlewares:
    add-forward-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - authorization

  routers:
    outpost:
      rule: "PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints:
        - web
      service: authentik
      priority: 1000

    radarr:
      rule: "Host(`radarr.asherlc.com`)"
      entryPoints:
        - web
      service: radarr
      middlewares:
        - add-forward-headers
        - authentik
    sonarr:
      rule: "Host(`sonarr.asherlc.com`)"
      entryPoints:
        - web
      service: sonarr
      middlewares:
        - add-forward-headers
        - authentik
    qbittorrent:
      rule: "Host(`qbittorrent.asherlc.com`)"
      entryPoints:
        - web
      service: qbittorrent
      middlewares:
        - add-forward-headers
        - authentik
    prowlarr:
      rule: "Host(`prowlarr.asherlc.com`)"
      entryPoints:
        - web
      service: prowlarr
      middlewares:
        - add-forward-headers
        - authentik
    dashdot:
      rule: "Host(`dashdot.asherlc.com`)"
      entryPoints:
        - web
      service: dashdot
      middlewares:
        - add-forward-headers
        - authentik
    homarr:
      rule: "Host(`homarr.asherlc.com`)"
      entryPoints:
        - web
      service: homarr
      middlewares:
        - add-forward-headers
        - authentik

  services:
    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
        passHostHeader: true
    radarr:
      loadBalancer:
        servers:
          - url: "http://radarr:7878"
    sonarr:
      loadBalancer:
        servers:
          - url: "http://sonarr:8989"
    qbittorrent:
      loadBalancer:
        servers:
          - url: "http://qbittorrent:8080"
    prowlarr:
      loadBalancer:
        servers:
          - url: "http://prowlarr:9696"
    dashdot:
      loadBalancer:
        servers:
          - url: "http://dashdot:3001"
    homarr:
      loadBalancer:
        servers:
          - url: "http://homarr:7575"
