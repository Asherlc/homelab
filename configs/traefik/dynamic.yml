http:
  middlewares:
    add-forward-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - authorization

  routers:
    # Authentik outpost (required)
    outpost:
      rule: "PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints:
        - web
      service: authentik
      priority: 1000

    # External domains (*.asherlc.com) - WITH authentication
    radarr-external:
      rule: "Host(`radarr.asherlc.com`)"
      entryPoints:
        - web
      service: radarr
      middlewares:
        - add-forward-headers
        - authentik
    sonarr-external:
      rule: "Host(`sonarr.asherlc.com`)"
      entryPoints:
        - web
      service: sonarr
      middlewares:
        - add-forward-headers
        - authentik
    qbittorrent-external:
      rule: "Host(`qbittorrent.asherlc.com`)"
      entryPoints:
        - web
      service: qbittorrent
      middlewares:
        - add-forward-headers
        - authentik
    prowlarr-external:
      rule: "Host(`prowlarr.asherlc.com`)"
      entryPoints:
        - web
      service: prowlarr
      middlewares:
        - add-forward-headers
        - authentik
    dashdot-external:
      rule: "Host(`dashdot.asherlc.com`)"
      entryPoints:
        - web
      service: dashdot
      middlewares:
        - add-forward-headers
        - authentik
    homarr-external:
      rule: "Host(`homarr.asherlc.com`)"
      entryPoints:
        - web
      service: homarr
      middlewares:
        - add-forward-headers
        - authentik

    # Local domains (*.home) - WITHOUT authentication
    homarr-local:
      rule: "Host(`homarr.home`)"
      entryPoints:
        - web
      service: homarr
    plex-local:
      rule: "Host(`plex.home`)"
      entryPoints:
        - web
      service: plex
    sonarr-local:
      rule: "Host(`sonarr.home`)"
      entryPoints:
        - web
      service: sonarr
    radarr-local:
      rule: "Host(`radarr.home`)"
      entryPoints:
        - web
      service: radarr
    bazarr-local:
      rule: "Host(`bazarr.home`)"
      entryPoints:
        - web
      service: bazarr
    prowlarr-local:
      rule: "Host(`prowlarr.home`)"
      entryPoints:
        - web
      service: prowlarr
    overseerr-local:
      rule: "Host(`overseerr.home`)"
      entryPoints:
        - web
      service: overseerr
    tautulli-local:
      rule: "Host(`tautulli.home`)"
      entryPoints:
        - web
      service: tautulli
    qbittorrent-local:
      rule: "Host(`qbittorrent.home`)"
      entryPoints:
        - web
      service: qbittorrent
    autoscan-local:
      rule: "Host(`autoscan.home`)"
      entryPoints:
        - web
      service: autoscan

  services:
    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
        passHostHeader: true
    radarr:
      loadBalancer:
        servers:
          - url: "http://radarr:7878"
    sonarr:
      loadBalancer:
        servers:
          - url: "http://sonarr:8989"
    qbittorrent:
      loadBalancer:
        servers:
          - url: "http://qbittorrent:8080"
    prowlarr:
      loadBalancer:
        servers:
          - url: "http://prowlarr:9696"
    dashdot:
      loadBalancer:
        servers:
          - url: "http://dashdot:3001"
    homarr:
      loadBalancer:
        servers:
          - url: "http://homarr:7575"
    plex:
      loadBalancer:
        servers:
          - url: "http://172.17.0.1:32400"
    bazarr:
      loadBalancer:
        servers:
          - url: "http://bazarr:6767"
    overseerr:
      loadBalancer:
        servers:
          - url: "http://overseerr:5055"
    tautulli:
      loadBalancer:
        servers:
          - url: "http://tautulli:8181"
    autoscan:
      loadBalancer:
        servers:
          - url: "http://autoscan:3030"
