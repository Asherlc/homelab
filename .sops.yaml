# SOPS Configuration
# Defines which files to encrypt and which keys to use

creation_rules:
  # Overseerr - encrypt specific keys only
  - path_regex: configs/overseerr/settings\.json$
    encrypted_regex: '^(apiKey|vapidPrivate|vapidPublic|api_key)$'
    age: age1cmvfpx67qzk2g8ldw5q8k356msnw0zxjvwg68dxux6475cyy5arsvekytd
  
  # Bazarr - encrypt auth, apikey, passwords, tokens
  - path_regex: configs/bazarr/config\.yaml$
    encrypted_regex: '^(auth|apikey|password|token|key)$'
    age: age1cmvfpx67qzk2g8ldw5q8k356msnw0zxjvwg68dxux6475cyy5arsvekytd
  
  # Homarr - encrypt API keys and secrets
  - path_regex: configs/homarr/.*\.json$
    encrypted_regex: '^(apiKey|api_key|token|password|secret)$'
    age: age1cmvfpx67qzk2g8k356msnw0zxjvwg68dxux6475cyy5arsvekytd
  
  # Configarr secrets - encrypt entire file (no regex = full file encryption)
  - path_regex: configarr/secrets\.ya?ml$
    age: age1cmvfpx67qzk2g8ldw5q8k356msnw0zxjvwg68dxux6475cyy5arsvekytd
  
  # Generic patterns for future files
  # .env files - encrypt entire file
  - path_regex: \.env$
    age: age1cmvfpx67qzk2g8ldw5q8k356msnw0zxjvwg68dxux6475cyy5arsvekytd
  
  # SSL/TLS keys - encrypt entire file
  - path_regex: (.*-key\.pem|privkey\.pem|.*\.key)$
    age: age1cmvfpx67qzk2g8ldw5q8k356msnw0zxjvwg68dxux6475cyy5arsvekytd
